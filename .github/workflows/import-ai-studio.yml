name: Import AI Studio project

on:
  push:
    paths:
      - 'accountveda (1).zip'
      - 'accountveda.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          ZIP=""
          if [ -f "accountveda (1).zip" ]; then ZIP="accountveda (1).zip"; fi
          if [ -z "$ZIP" ] && [ -f "accountveda.zip" ]; then ZIP="accountveda.zip"; fi
          test -n "$ZIP"
          rm -rf /tmp/accountveda
          mkdir -p /tmp/accountveda
          unzip -q "$ZIP" -d /tmp/accountveda
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/accountveda/. .
          rm -f "accountveda (1).zip" accountveda.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import exact Google AI Studio project" || true
          git push
